services:
  - type: worker
    name: discord-music-bot
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_DEV_GUILD_ID
        sync: false
      - key: VOICE_CHANNEL_ID
        sync: false
      - key: CATEGORY_ID
        sync: false
      - key: ALLOWED_ROLE_IDS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        value: discord
      - key: SUPABASE_SONGS_TABLE
        value: songs
      - key: AUTO_JOIN_DELAY_MS
        value: "30000"
      - key: AUTO_LEAVE_DELAY_MS
        value: "30000"
      - key: DEFAULT_VOLUME
        value: "0.5"
      - key: COMMAND_COOLDOWN_MS
        value: "3000"
      - key: SIGNED_URL_EXPIRY_SECONDS
        value: "3600"
      - key: LIBRARY_SYNC_INTERVAL_MS
        value: "120000"
      - key: MAX_QUEUE_LENGTH
        value: "200"
      - key: MAX_VOICE_CONNECTIONS
        value: "5"
      - key: MAX_FILE_SIZE_BYTES
        value: "52428800"
      - key: MAX_CONSECUTIVE_TRACK_FAILURES
        value: "5"
      - key: GUILD_COMMAND_COOLDOWN_MS
        value: "1000"
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: info
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.16.0
